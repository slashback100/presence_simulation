start:
  name: Presence simulation start
  description: Start the presence simulation
  fields:
    switch_id:
      name: The id of the presence simulation switch
      description: The id of the presence simulation switch
      example: switch.presence_simulation_2
    entity_id:
      name: Entities list
      description: The list of entities to use by the presence simulation to override the list configured in the component
      example: >
            - group.outside_lights
    labels:
      name: Labels list
      description: The list of labels whose entities should be used by the presence simulation, in addition to the configured entities
      example: >
            - presence_simulation
    delta:
      name: Delta
      description: Override the default number of days used by the simulation
      example: 7
    restore_states:
      name: Should presence simulation status be restored after restart
      description: Override the default restore switch. If set, the states will be restored after the simulation
      example: True
    random:
      name: Activate random
      description: Add a random factor (in seconds) to the historic events
      example: 300
    unavailable_as_off:
      name: Consider unavailable as off
      description: Override the default behavior and consider unavailable entities as off
      example: True
    brightness:
      name: Set light brightness
      description: Set a specific brightness fot lights that allows it
      example: 75
    history_end:
      name: End date of the historic
      description: The date and time (ISO format) at the end of the historic to replay, instead of the current date
      example: "2024-01-15T18:00:00"
    use_snapshot:
      name: Use snapshot
      description: Replay the stored snapshot instead of fetching the history from the recorder
      example: True
stop:
  description: Stop the presence simulation
  name: Presence simulation stop
  fields:
    switch_id:
      name: The id of the presence simulation switch
      description: The id of the presence simulation switch
      example: switch.presence_simulation_2
toggle:
  description: Toggle the presence simulation
  name: Presence simulation toggle
  fields:
    switch_id:
      name: The id of the presence simulation switch
      description: The id of the presence simulation switch
      example: switch.presence_simulation_2
capture_snapshot:
  name: Presence simulation capture snapshot
  description: Capture the recorder history into a local snapshot that the simulation can replay
  fields:
    switch_id:
      name: The id of the presence simulation switch
      description: The id of the presence simulation switch
      example: switch.presence_simulation_2
    delta:
      name: Delta
      description: Number of days of history to capture
      example: 7
    history_end:
      name: End date of the historic
      description: The date and time (ISO format) at the end of the history to capture, instead of the current date
      example: "2024-01-15T18:00:00"
create_demo_snapshot:
  name: Presence simulation create demo snapshot
  description: Create a temporary seven-day demo snapshot for safe testing
  fields:
    switch_id:
      name: The id of the presence simulation switch
      description: The id of the presence simulation switch
      example: switch.presence_simulation_2
